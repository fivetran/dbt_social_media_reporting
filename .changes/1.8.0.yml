version: 1.8.0
pr_number: 0
breaking_changes:
- title: Facebook impressions now use media views
  description: For Facebook rows, the `impressions` field in `social_media_reporting__rollup_report` now holds Facebook media views (`media_views` from `facebook_pages__posts_report`). Facebook deprecated its impressions metrics on November 15, 2025, so the old field reported near-zero values for recent posts. For older records, `media_views` falls back to `impressions`. Expect higher Facebook `impressions` values after you upgrade.
dependencies:
- package: fivetran/facebook_pages
  old_version: '[">=1.4.0", "<1.5.0"]'
  new_version: '[">=1.5.0", "<1.6.0"]'
  description: Adds support for the `media_views` field and media view breakdowns.
date: '2026-11-20'
