version: 1.7.0
pr_number: 45
schema_data_changes:
  entries:
  - models:
    - '`social_media_reporting__rollup_report`'
    - '`social_media_reporting__facebook_posts_reporting`'
    change_type: Changed field logic
    old: For Facebook rows, `impressions` reads `impressions` from `facebook_pages__posts_report`
    new: For Facebook rows, `impressions` reads `media_views` from `facebook_pages__posts_report`
    is_breaking: true
    notes: >-
      Facebook deprecated its impressions metrics on November 15, 2025, so Facebook
      `impressions` showed near-zero values for recent posts. Facebook rows now hold
      Facebook media views. For older records, `media_views` falls back to `impressions`.
      Requires Facebook Pages v1.4.0. Added in
      [PR #46](https://github.com/fivetran/dbt_social_media_reporting/pull/46).
      Expect higher Facebook `impressions` values after you upgrade.
new_features:
- title: Breaking change
  description: Raises the minimum dbt version to 1.10.0.
- description: Adds `dbt_utils.unique_combination_of_columns` tests to staging and
    end models. If a test fails, please [open an issue](https://github.com/fivetran/dbt_social_media_reporting/issues/new/choose).
dependencies:
- package: fivetran/facebook_pages
  old_version: '[">=1.3.0", "<1.4.0"]'
  new_version: '[">=1.4.0", "<1.5.0"]'
  description: Adds support for the latest upstream release.
- package: fivetran/instagram_business
  old_version: '[">=1.2.0", "<1.3.0"]'
  new_version: '[">=1.3.0", "<1.4.0"]'
  description: Adds support for the latest upstream release.
- package: fivetran/twitter_organic
  old_version: '[">=1.2.0", "<1.3.0"]'
  new_version: '[">=1.3.0", "<1.4.0"]'
  description: Adds support for the latest upstream release.
- package: fivetran/linkedin_pages
  old_version: '[">=1.5.0", "<1.6.0"]'
  new_version: '[">=1.6.0", "<1.7.0"]'
  description: Adds support for the latest upstream release.
- package: fivetran/youtube_analytics
  old_version: '[">=1.2.0", "<1.3.0"]'
  new_version: '[">=1.3.0", "<1.4.0"]'
  description: Adds support for the latest upstream release.
under_the_hood:
- description: Updates yml column documentation to match model output.
date: '2026-11-18'
